name: Deploy to Hostinger via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔨 Build production project
        run: npm run build

      - name: 🧹 Prepare Server Host
        id: prep
        run: |
          RAW_SERVER="${{ secrets.FTP_SERVER }}"
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -E 's~^[a-zA-Z]+://~~' | sed -E 's~:[0-9]+$~~' | tr -d '[:space:]' | sed -E 's~/+$~~')
          echo "host=$CLEAN_SERVER" >> $GITHUB_OUTPUT

      - name: 📂 Sync files to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.prep.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_DIR || 'public_html/' }}
          dangerous-clean-slate: false
